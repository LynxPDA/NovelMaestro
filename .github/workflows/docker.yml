# Docker-образ NovelMaestro → ghcr.io (GitHub Container Registry).
#
# Запуск: вкладка Actions → «Docker image» → «Run workflow» (кнопка),
# или автоматически при пуше тега v* (например, git tag v1.2.3 && git push).
# Образы: ghcr.io/<владелец>/<репо>:latest (по кнопке) и :<версия> (по тегу),
# платформы linux/amd64 + linux/arm64.

name: Docker image

on:
  workflow_dispatch:          # ручная сборка по кнопке
  push:
    tags: ["v*"]              # автоматически по тегу v1.2.3

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # release.yml передвигает тег на коммит с VERSION = тег ПОСЛЕ пуша
      # тега, а все воркфлоу стартуют одновременно: checkout без явного
      # ref фиксирует sha из события (старый коммит со старой цифрой).
      # Ждём, пока удалённый тег укажет на коммит с правильным VERSION
      # (не нужен, если bump не потребовался — совпадение сразу).
      - name: Дождаться синхронизации тега с VERSION
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp=$(mktemp -d)
          git init -q "$tmp"
          ok=""
          for i in $(seq 1 36); do
            sha=$(git ls-remote "$url" "refs/tags/${GITHUB_REF_NAME}" | cut -f1)
            if [ -n "$sha" ] \
               && git -C "$tmp" fetch --depth 1 -q "$url" "$sha" 2>/dev/null \
               && [ "$(git -C "$tmp" show "$sha":VERSION 2>/dev/null)" = "$ver" ]; then
              ok=1; break
            fi
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не указывает на коммит с VERSION=$ver (не отработал release.yml?)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # ref явный: тег разрешается СЕЙЧАС (после ожидания),
          # а не по sha события пуша
          ref: ${{ github.ref_name }}

      - name: QEMU (эмуляция arm64 на amd64-раннере)
        uses: docker/setup-qemu-action@v3

      # VERSION — единственный источник версии в образе (web/version.py), .git в
      # контекст сборки не входит. По тегу сверяем: расхождение VERSION с тегом
      # раньше давало образ «новой» версии со старой цифрой в интерфейсе.
      - name: VERSION = тег
        if: github.event_name == 'push'
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$(cat VERSION)" ]; then
            echo "::error::VERSION ($(cat VERSION)) не совпадает с тегом $GITHUB_REF_NAME — обновите VERSION или передвиньте тег"
            exit 1
          fi

      - name: Настройка buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
