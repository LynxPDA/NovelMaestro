# Docker-образ NovelMaestro → ghcr.io (GitHub Container Registry).
#
# Запуск: вкладка Actions → «Docker image» → «Run workflow» (кнопка),
# или автоматически при пуше тега v* (например, git tag v1.2.3 && git push).
# Образы: ghcr.io/<владелец>/<репо>:latest (по кнопке) и :<версия> (по тегу),
# платформы linux/amd64 + linux/arm64.

name: Docker image

on:
  workflow_dispatch:          # ручная сборка по кнопке
  push:
    tags: ["v*"]              # автоматически по тегу v1.2.3

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
