# Портативная Windows-сборка NovelMaestro → zip-артефакт/релиз.
#
# Запуск: вкладка Actions → «Portable Windows build» → «Run workflow»
# (можно указать версию Python и метку имени zip), или автоматически при
# пуше тега v* — тогда zip прикрепляется к GitHub Release этого тега.
# Сборка идёт на windows-latest (см. packaging/build_portable_windows.ps1).

name: Portable Windows build

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Версия Python (embeddable, напр. 3.12.8)"
        required: false
        default: "3.12.8"
      label:
        description: "Метка имени zip (пусто — дата)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # release.yml передвигает тег на коммит с VERSION = тег ПОСЛЕ пуша
      # тега, а все воркфлоу стартуют одновременно: checkout без явного
      # ref фиксирует sha из события (старый коммит со старой цифрой).
      # Ждём, пока удалённый тег укажет на коммит с правильным VERSION
      # (не нужен, если bump не потребовался — совпадение сразу).
      - name: Дождаться синхронизации тега с VERSION
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp=$(mktemp -d)
          git init -q "$tmp"
          ok=""
          for i in $(seq 1 36); do
            sha=$(git ls-remote "$url" "refs/tags/${GITHUB_REF_NAME}" | cut -f1)
            if [ -n "$sha" ] \
               && git -C "$tmp" fetch --depth 1 -q "$url" "$sha" 2>/dev/null \
               && [ "$(git -C "$tmp" show "$sha":VERSION 2>/dev/null)" = "$ver" ]; then
              ok=1; break
            fi
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не указывает на коммит с VERSION=$ver (не отработал release.yml?)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # ref явный: тег разрешается СЕЙЧАС (после ожидания), а не по
          # sha события пуша; креды не оставляем в workspace: сборка
          # работает только со своими файлами
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Сборка портативного пакета
        shell: powershell
        env:
          PY_VERSION: ${{ inputs.python_version }}
          PKG_LABEL: ${{ inputs.label }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # на push-событии inputs пуст → дефолт 3.12.8 (как в форме)
          $py = if ($env:PY_VERSION) { $env:PY_VERSION } else { "3.12.8" }
          $label = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:PKG_LABEL }
          & packaging/build_portable_windows.ps1 -Label $label -PythonVersion "$py"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: novelmaestro-portable
          # только портативный пакет; python-*.zip (загруженный
          # embeddable) в dist/ — служебный, в артефакт не идёт
          path: dist/novelmaestro-portable-*.zip
          if-no-files-found: error

      - name: Прикрепить к релизу (только по тегу)
        if: github.event_name == 'push'
        # релиз мог уже существовать (пересборка того же тега): gh release create
        # на существующий падает, поэтому — обновить ассет
        # shell обязателен: на windows-latest по умолчанию pwsh, а тут bash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # контекст github — из env, а не прямо в shell: имя тега не должно
          # разворачиваться в командную строку
          RELEASE: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" dist/novelmaestro-portable-*.zip --clobber
            echo "релиз $RELEASE уже был — zip обновлён"
          else
            gh release create "$RELEASE" dist/novelmaestro-portable-*.zip --generate-notes
          fi
