# Портативная Windows-сборка NovelMaestro → zip-артефакт/релиз.
#
# Запуск: вкладка Actions → «Portable Windows build» → «Run workflow»
# (можно указать версию Python и метку имени zip), или автоматически при
# пуше тега v* — тогда zip прикрепляется к GitHub Release этого тега.
# Сборка идёт на windows-latest (см. packaging/build_portable_windows.ps1).

name: Portable Windows build

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Версия Python (embeddable, напр. 3.12.8)"
        required: false
        default: "3.12.8"
      label:
        description: "Метка имени zip (пусто — дата)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # креды не оставляем в workspace: пуш VERSION — отдельным шагом
          # с токеном в URL (см. ниже), сборка идёт без доступа к репозиторию
          persist-credentials: false

      - name: VERSION = тег (только по тегу)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "Версия релиза: $ver"
          if [ "$ver" != "$(cat VERSION)" ]; then
            printf '%s\n' "$ver" > VERSION
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "chore(repo): VERSION $ver (авто, релиз $GITHUB_REF_NAME)"
            git tag -f "$GITHUB_REF_NAME"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main "+${GITHUB_REF_NAME}"
          fi

      - name: Сборка портативного пакета
        shell: powershell
        env:
          PY_VERSION: ${{ inputs.python_version }}
          PKG_LABEL: ${{ inputs.label }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # на push-событии inputs пуст → дефолт 3.12.8 (как в форме)
          $py = if ($env:PY_VERSION) { $env:PY_VERSION } else { "3.12.8" }
          $label = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:PKG_LABEL }
          & packaging/build_portable_windows.ps1 -Label $label -PythonVersion "$py"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: novelmaestro-portable
          # только портативный пакет; python-*.zip (загруженный
          # embeddable) в dist/ — служебный, в артефакт не идёт
          path: dist/novelmaestro-portable-*.zip
          if-no-files-found: error

      - name: Прикрепить к релизу (только по тегу)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/novelmaestro-portable-*.zip --generate-notes
