# Юзерскрипты tools/: сборка из src/, проверка и выкладка на релиз.
#
# Публикуемый файл — один (менеджеры скриптов ставят один .user.js), поэтому
# артефакты собираются из tools/<скрипт>/src/* и прикрепляются к релизу.
#
# Запуск: вкладка Actions → «Userscripts build» → «Run workflow» (кнопка; поле
# «Тег релиза» — если нужно доложить ассеты к существующему релизу), или
# автоматически при пуше тега v*.
#
# Почему релиз ЖДУТ, а не реагируют на него: релиз создаёт windows.yml своим
# прогоном на дефолтном GITHUB_TOKEN, а действия, сделанные этим токеном, новых
# воркфлоу не запускают — то есть воркфлоу на `release: published` не запустился
# бы никогда. Сборка под Windows идёт ~80 с, этот прогон — ~20 с, так что на пуше
# тега юзерскрипты приходят первыми. Раньше это значило «релиза ещё нет» →
# предупреждение → зелёный прогон без ассетов (v0.3.2 вышел ровно с одним zip).
# Теперь прогон ждёт публикацию релиза и краснеет, если так и не дождался.
#
# p.s. зависимости ставятся полными requirements.txt: сборщику нужен импорт
# core.common (atomic_write и log_argv), а тот тянет транспорт и dotenv —
# список ролей живёт в requirements.txt, а не в воркфлоу.

name: Userscripts build

on:
  workflow_dispatch:          # ручная пересборка и выкладка по кнопке
    inputs:
      release:
        description: "Тег релиза (пусто — только артефакт, без релиза)"
        required: false
        default: ""
  push:
    tags: ["v*"]              # автоматически по тегу v1.2.3

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # сколько раз и с каким интервалом смотреть, появился ли релиз
    # (окно заведомо длиннее сборки под Windows)
    env:
      RELEASE_WAIT_TRIES: "36"
      RELEASE_WAIT_SLEEP: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          # креды не оставляем в workspace: сборка работает только
          # со своими файлами
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Зависимости (сборщик импортирует core.common)
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Артефакты обязаны совпадать со сборкой
        run: python3 tools/build_userscripts.py --check --node-check

      - name: Собрать и разложить по dist/
        run: |
          python3 tools/build_userscripts.py
          mkdir -p dist
          for f in tools/*/*.user.js; do
            cp "$f" "dist/$(basename "$f")"
            echo "готово: $(basename "$f") ($(wc -l < "$f") строк)"
          done

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: userscripts
          path: dist/*.user.js
          if-no-files-found: error

      - name: Прикрепить к релизу (только по тегу)
        if: github.event_name == 'push' || inputs.release
        # один env на шаг: два соседних ключа env — невалидный workflow, GitHub
        # отказывался запускать всё воркфлоу
        env:
          GH_TOKEN: ${{ github.token }}
          # контекст github — из env, а не прямо в shell: имя тега не должно
          # разворачиваться в командную строку
          RELEASE: ${{ github.event.release.tag_name || inputs.release || github.ref_name }}
        run: |
          # релиз создаёт windows.yml: ждём, а не ругаемся — сборка под Windows
          # дольше этого прогона
          for i in $(seq 1 "$RELEASE_WAIT_TRIES"); do
            if gh release view "$RELEASE" >/dev/null 2>&1; then
              echo "релиз $RELEASE есть (подождали $((i * RELEASE_WAIT_SLEEP)) с)"
              break
            fi
            sleep "$RELEASE_WAIT_SLEEP"
          done
          # и только теперь строгая проверка: молча пройти нельзя — так ассеты
          # и терялись
          gh release view "$RELEASE" >/dev/null 2>&1 || {
            echo "::error::релиза $RELEASE нет за отведённое время — ассеты некуда класть"
            exit 1
          }
          gh release upload "$RELEASE" dist/*.user.js --clobber
          echo "прикреплено к $RELEASE: $(ls dist/*.user.js | xargs -n1 basename | tr '\n' ' ')"

      - name: Сбросить кэш CDN (только по тегу)
        if: github.event_name == 'push' || inputs.release
        run: |
          # Обновления ходят на raw (max-age=300), но CDN остаётся зеркалом
          # установки, а кэш ветки там живёт неделю. Чистит его отдельный сервис
          # purge.jsdelivr.net методом GET: старый способ — curl -X PURGE по URL
          # файла — отвечает 400 и раньше проходил зелёным, ничего не сбрасывая.
          for f in tools/*/*.user.js tools/*/*.meta.js; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}"
            echo "PURGE ${f} → $(curl -s -m 30 "$url" | tr -d ' \n' | head -c 110)"
          done

      - name: Ссылки для установки
        run: |
          echo "### Ссылки установки (raw — основной путь, до 5 минут)"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          for f in tools/*/*.user.js; do
            echo "- $(basename "$f"): ${raw}/$(basename "$f")"
          done
          echo
          echo "### Зеркало (jsDelivr, MIME application/javascript)"
          cdn="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main"
          for f in tools/*/*.user.js; do
            echo "- $(basename "$f"): ${cdn}/$(basename "$f")"
          done
