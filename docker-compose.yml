# NovelMaestro в Docker — один сервис, web-интерфейс :8756.
#
# ⚠ ТРЕБУЕТСЯ Docker Compose v2: запускайте `docker compose up -d`
# (без тире). Старый `docker-compose` v1 (Python) НЕ поддерживается —
# он не понимает формат env_file/required и упадёт с ошибкой парсинга.
#
# Быстрый старт:
#   docker compose pull && docker compose up -d   # готовый образ из ghcr.io
#   docker compose up -d --build       # или локальная сборка из исходников
#   → http://localhost:8756
#
# Проверка правок на боевых данных (локальный образ вместо реестра):
#   ./dev.sh image                     # соберёт <VERSION>-dev и :dev
#   docker compose up -d               # compose возьмёт :dev и пересоздаст
#   ...посмотреть руками...
#   NOVELMAESTRO_IMAGE=ghcr.io/lynxpda/novelmaestro:latest docker compose up -d
# Источник образа — NOVELMAESTRO_IMAGE (окружение или .env рядом с файлом),
# по умолчанию локальный :dev: боевой контейнер поднимается с последней
# собранной сборки, а не с выпущенного релиза, и тег не надо править после
# каждой пересборки. Релизный образ подставляется переменной — правка
# `image:` руками уезжала бы в git и могла там остаться.
# pull_policy: never — локального образа нет в реестре, без этого
# `docker compose pull` падал бы «pull access denied» и рвал `pull && up -d`.
#
# Данные:
#   ./projects        — ВСЕ проекты (обязательно монтировать, иначе потеряются)
#   ./templates       — ваши наборы шаблонов + встроенный General/, который
#                       контейнер обновляет из образа при каждом старте
#   ./web/job_logs    — история запусков (jobs.json + логи; необязательно)
#
# Конфиг: environment в compose — ТОЛЬКО деплой-обвязка (WEB_*, TZ):
# это ключи запуска самого контейнера. LLM-конфиг и дефолты стадий
# задают ТОЛЬКО в системном .env: вкладка «Настройки» или файл
# projects/.env на хосте (постоянный том, WEB_ENV_FILE; сид из шаблона
# при первом старте, переживает обновление образа). Проектные
# pdir/.env (том projects) перекрывают системный по ключам.
# Приоритет: environment compose (WEB_*) > projects/.env >
# встроенный дефолт кода.
# LLM-скрипты в subprocess наследуют окружение (HOST/API_KEY/MODEL
# доходят до них); префилл форм «Запусков» тоже читает окружение прежде
# файла (для WEB_* из compose).
# Правки environment применяются после `docker compose up -d`.
# Внешний вид (тема/кегль) — в localStorage браузера.
# Токен (при WEB_AUTH=1) генерируется в projects/.web_secret и сохраняется
# между перезапусками (volume).
services:
  novelmaestro:
    build: .                                    # исходники для --build
    # По умолчанию — последняя локальная сборка (`./dev.sh image` метит её
    # же тегом :dev, поэтому правка файла после пересборки не нужна:
    # `docker compose up -d` пересоздаёт контейнер на новом образе).
    # Релизный образ — NOVELMAESTRO_IMAGE=ghcr.io/lynxpda/novelmaestro:latest.
    image: ${NOVELMAESTRO_IMAGE:-novelmaestro:dev}
    # # Релизный образ из реестра — для истории и отката. Вернуть его:
    # # раскомментировать строку ниже (или задать NOVELMAESTRO_IMAGE).
    # image: ghcr.io/lynxpda/novelmaestro:latest
    # В реестре локального тега нет: без этого `docker compose pull`
    # падал бы «pull access denied» и рвал команду `pull && up -d`.
    pull_policy: never
    container_name: novelmaestro
    restart: unless-stopped
    # uid/gid: контейнер стартует от root, docker-entrypoint.sh сам
    # выставляет владельца app (uid 1000) на каталоги данных — файлы в
    # ./projects принадлежат uid 1000 (типичный хост-пользователь) и
    # доступны для ручной правки. Иной uid: поменяйте useradd -u 1000
    # в Dockerfile (или задайте user: "${UID}:${GID}" — но тогда
    # entrypoint не сможет chown каталоги, созданные docker от root).
    # LLM-сервер на хосте (llama.cpp и т.п.): в bridge-сети контейнера
    # 127.0.0.1 — это сам контейнер, поэтому HOST=http://127.0.0.1:9989 из
    # .env внутри него даёт Connection refused. Нужен адрес хоста: либо
    # host.docker.internal (раскомментируйте extra_hosts ниже — Engine
    # ≥ 20.10, т.е. любой, где работает compose v2), либо LAN-IP хоста.
    # По умолчанию выключено: в шаблоне .env стоит облачный API, там все
    # адреса внешние и резолвер хоста не нужен.
    # extra_hosts:                            # LLM-сервер на хосте
    #   - "host.docker.internal:host-gateway"
    #   # и в .env: HOST=http://host.docker.internal:9989/v1
    ports:
      - "8756:8756"                 # web-интерфейс
    volumes:
      - ./projects:/app/projects     # все проекты (обязательно)
      - ./templates:/app/templates   # ваши наборы шаблонов; General/ и .env.example
      #                              # контейнер обновляет из образа при старте
      - ./web/job_logs:/app/web/job_logs
    environment:
      WEB_HOST: 0.0.0.0
      # ⚠ ВНИМАНИЕ (безопасность): при WEB_HOST: 0.0.0.0 и выключенной
      # авторизации сервер открыт ВСЕЙ локальной сети — любой в ней может
      # читать .env (ключи LLM) и управлять проектами. Для машины не «только
      # для себя» включите авторизацию: раскомментируйте WEB_AUTH и
      # WEB_TOKEN (или оставьте автотокен — он печатается в docker logs).
      # WEB_AUTH: "1"               # включить токен (иначе — доверенная LAN)
      # WEB_TOKEN: "..."            # при --auth; иначе автогенерация
      # WEB_MAX_UPLOAD_MB: "512"
      # WEB_JOBS_LIMIT: "2"
      # LLM-конфиг и дефолты стадий (HOST/API_KEY/MODEL, *_MODEL,
      # TRANSLATE_CHECK_*, PIPELINE_*) в compose НЕ задают — их единое
      # место: вкладка «Настройки» (системный projects/.env в томе,
      # переживает обновление образа) или правка файла на хосте.
      # Часовой пояс для отчётов (местное время):
      # TZ: "Europe/Moscow"
    # HEALTHCHECK зашит в образ (Dockerfile): GET /api/session
