# NovelMaestro в Docker — один сервис, web-интерфейс :8756.
#
# ⚠ ТРЕБУЕТСЯ Docker Compose v2: запускайте `docker compose up -d`
# (без тире). Старый `docker-compose` v1 (Python) НЕ поддерживается —
# он не понимает формат env_file/required и упадёт с ошибкой парсинга.
#
# Быстрый старт:
#   docker compose pull && docker compose up -d   # готовый образ из ghcr.io
#   docker compose up -d --build       # или локальная сборка из исходников
#   → http://localhost:8756
#
# Данные:
#   ./projects        — ВСЕ проекты (обязательно монтировать, иначе потеряются)
#   ./templates       — ваши наборы шаблонов (иначе потеряются при обновлении)
#   ./web/job_logs    — история запусков (jobs.json + логи; необязательно)
#
# Конфиг: environment в compose — приоритетный слой (окружение > файл).
# Системный .env в Docker живёт в ПОСТОЯННОМ ТОМЕ: /app/projects/.env
# (WEB_ENV_FILE в образе; entrypoint сидирует его из шаблона при первом
# старте). Вкладка «Настройки» правит именно его — правки переживают
# обновление образа. /app/.env внутри образа — заводские дефолты-фолбэк.
# LLM-скрипты в subprocess наследуют окружение (HOST/API_KEY/MODEL
# доходят до них); get_server_config и префилл форм «Запусков» читают
# окружение прежде файла (HOST из compose виден в форме даже при
# существующем pdir/.env проекта).
# Правки environment применяются после `docker compose up -d`.
# Внешний вид (тема/кегль) — в localStorage браузера.
# Токен (при WEB_AUTH=1) генерируется в projects/.web_secret и сохраняется
# между перезапусками (volume).
services:
  novelmaestro:
    build: .                                    # исходники для --build
    image: ghcr.io/lynxpda/novelmaestro:latest   # готовый образ из реестра
    container_name: novelmaestro
    restart: unless-stopped
    # uid/gid: контейнер стартует от root, docker-entrypoint.sh сам
    # выставляет владельца app (uid 1000) на каталоги данных — файлы в
    # ./projects принадлежат uid 1000 (типичный хост-пользователь) и
    # доступны для ручной правки. Иной uid: поменяйте useradd -u 1000
    # в Dockerfile (или задайте user: "${UID}:${GID}" — но тогда
    # entrypoint не сможет chown каталоги, созданные docker от root).
    ports:
      - "8756:8756"                 # web-интерфейс
    volumes:
      - ./projects:/app/projects     # все проекты (обязательно)
      - ./templates:/app/templates   # ваши наборы шаблонов — иначе потеряются
      #                              # при пересоздании контейнера (обновлении)
      - ./web/job_logs:/app/web/job_logs
    environment:
      WEB_HOST: 0.0.0.0
      # LLM-конфиг: раскомментируйте и впишите свои значения (переопреде-
      # ляют /app/.env из образа; приоритет окружения над файлом).
      # HOST: "http://192.168.1.8:9989"   # адрес LLM-сервера
      # API_KEY: "..."                   # ключ (пусто — без ключа)
      # MODEL: "..."                     # модель по умолчанию
      # ⚠ ВНИМАНИЕ (безопасность): при WEB_HOST: 0.0.0.0 и выключенной
      # авторизации сервер открыт ВСЕЙ локальной сети — любой в ней может
      # читать .env (ключи LLM) и управлять проектами. Для машины не «только
      # для себя» включите авторизацию: раскомментируйте WEB_AUTH и
      # WEB_TOKEN (или оставьте автотокен — он печатается в docker logs).
      # WEB_AUTH: "1"               # включить токен (иначе — доверенная LAN)
      # WEB_TOKEN: "..."            # при --auth; иначе автогенерация
      # WEB_MAX_UPLOAD_MB: "512"
      # WEB_JOBS_LIMIT: "2"
      # Дефолты формы «2 · Проверка перевода» (переопределяют /app/.env):
      # TRANSLATE_CHECK_NEIGHBOR: "1.0±0.05"
      # TRANSLATE_CHECK_ORIGINAL: "2.1±0.5"
      # TRANSLATE_CHECK_REGEXP_CHECKS: "[一-鿿【】「」『』]+\n[a-zA-Z]+"
      # Часовой пояс для отчётов (местное время):
      # TZ: "Europe/Moscow"
    # HEALTHCHECK зашит в образ (Dockerfile): GET /api/session
